[project]
name = "AtomForge"
version = "0.1.0"
description = "Materials science discovery platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal[api-proxy-support]>=1.4.2",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.0",
    "simpleeval==1.0.3",
    "numpy>=2.4.4",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
atomforge = "main:main"
dev = "atomforge.tasks:dev"
deploy = "atomforge.tasks:deploy"

[tool.poe.tasks._backend]
cmd = "uvicorn atomforge.api.http:web_app --host 127.0.0.1 --port 8000 --reload --reload-dir atomforge --reload-exclude '*/node_scripts/*'"

[tool.poe.tasks._frontend]
cmd = "bun run dev -- --host 127.0.0.1 --port 5173"
cwd = "frontend"

[tool.poe.tasks.dev]
help = "Start the local API and frontend together"
parallel = ["_backend", "_frontend"]

[tool.poe.tasks.deploy-platform]
help = "Deploy the private Modal execution platform"
cmd = "uv run --no-sync modal deploy atomforge/platform/modal/deployment.py --name atomforge-workers --env main"

[project.optional-dependencies]
orchestrator = [
    # The control-plane worker rehydrates simulation structures and therefore
    # needs ASE, but not the model-training stack used by physics workers.
    "ase==3.28.0",
]
physics = [
    # MLIP Core
    "torch==2.3.1",
    "mace-torch==0.3.15",
    "cuequivariance-torch",
    "cuequivariance",
    # Simulation & Data
    "ase==3.28.0",
    "pymatgen==2026.3.23",
    "mp-api",
]
dev = [
    "poethepoet>=0.30.0",
    "ruff==0.16.0",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "experiments/results",
    "experiments/reports",
    "experiments/studies/papers",
    "videos",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
